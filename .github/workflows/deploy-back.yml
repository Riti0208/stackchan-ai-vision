name: Deploy BE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-back-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
          cache: npm
          cache-dependency-path: back/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:e2e
      - run: npm run build
      - name: Deploy existing Worker
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify production health and paid API guard
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const url = 'https://stackchan-ai-vision.k-i-wrd-setuna-g.workers.dev/health';
          const response = await fetch(url, { signal: AbortSignal.timeout(15000) });
          assert.equal(response.status, 200);
          const health = await response.json();
          assert.equal(health.ok, true);
          assert.equal(health.ai_mode, 'mock');
          assert.equal(health.paid_session.active, false);
          console.log('Production healthy; paid API session inactive.');
          JS
