name: Deploy StackChan

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-back-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
          cache: npm
          cache-dependency-path: |
            back/package-lock.json
            front/package-lock.json
      - run: npm ci
      - name: Install frontend dependencies and self-hosted vision assets
        run: npm ci
        working-directory: front
      - name: Build frontend assets
        run: npm run build
        working-directory: front
      - name: Deploy existing Worker
        # CI builds front/dist once. Write beside wrangler.jsonc to preserve relative paths.
        run: |
          trap 'rm -f .wrangler-ci.json' EXIT
          node --input-type=module <<'JS'
          import { readFile, writeFile } from 'node:fs/promises';
          const config = JSON.parse(await readFile('wrangler.jsonc', 'utf8'));
          delete config.build;
          await writeFile('.wrangler-ci.json', JSON.stringify(config));
          JS
          npm run deploy -- --config .wrangler-ci.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify production HTTP endpoints
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          let lastError;
          for (let attempt = 0; attempt < 120; attempt++) {
            try {
              const url = 'https://stackchan-ai-vision.k-i-wrd-setuna-g.workers.dev/health';
              const response = await fetch(url, { signal: AbortSignal.timeout(15000) });
              assert.equal(response.status, 200);
              const health = await response.json();
              assert.equal(health.ok, true);
              assert.equal(health.deployment?.ready, true, 'Worker, room and API budget deployment must match');
              assert.equal(typeof health.paid_session.active, 'boolean');
              assert.equal(health.ai_mode, health.paid_session.active ? 'decisions' : 'mock');
              const base = new URL(url).origin;
              const page = await fetch(base, { signal: AbortSignal.timeout(15000) });
              assert.equal(page.status, 200);
              const html = await page.text();
              assert.match(html, /StackChan/);
              const entry = html.match(/src="([^"]+\.js)"/);
              assert.ok(entry, 'built frontend entry exists');
              for (const path of [entry[1], '/vision/face-worker.js', '/vision/vision_wasm_internal.wasm', '/models/blaze_face_short_range.tflite']) {
                const asset = await fetch(new URL(path, base), { method: 'HEAD', signal: AbortSignal.timeout(15000) });
                assert.equal(asset.status, 200, `production asset ${path}`);
              }
              const list = await fetch(`${base}/api/rooms/main/devices`, { signal: AbortSignal.timeout(15000) });
              assert.equal(list.status, 200);
              assert.ok(Array.isArray((await list.json()).devices));
              const monitor = await fetch(new URL('/monitor', url), { signal: AbortSignal.timeout(15000) });
              assert.equal(monitor.status, 200);
              assert.match(await monitor.text(), /StackChan 部屋モニター/);
              console.log('Worker, room and API budget versions match; HTTP endpoints healthy; API session observed without changing it.');
              lastError = null;
              break;
            } catch (error) {
              lastError = error;
              console.log('Waiting for deployment propagation (' + (attempt + 1) + '/120)...');
              if (attempt < 119) await new Promise(resolve => setTimeout(resolve, 5000));
            }
          }
          if (lastError) throw lastError;
          JS
