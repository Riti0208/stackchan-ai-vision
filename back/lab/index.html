<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StackChan · BE Lab</title><link rel="stylesheet" href="/lab.css"></head>
<body><header><a class="brand" href="/">◉ <span>StackChan</span><b>BE LAB</b></a><div class="badge" id="ai-mode">AI: 確認中</div></header>
<main><section class="intro"><div><div class="eyebrow">LOCAL INTEGRATION WORKBENCH</div><h1>ふたりの本音、ひとつの部屋。</h1><p>それぞれの内面から生まれる、表情・しぐさ・会話を観察する。</p></div><span class="room">ROOM <strong>main</strong></span></section>
<section class="controls"><div><label for="token">制御トークン</label><div class="input-row"><input id="token" type="password" autocomplete="off" placeholder=".dev.vars の control_token"><button id="control">制御を開始</button><button class="secondary" id="release" disabled>解除</button></div></div><div><label for="detection">顔検出の入力</label><select id="detection"><option value="synthetic">合成映像に合わせた模擬検出</option><option value="manual">映像をクリックして注目位置を指定</option><option value="none">顔なしを送信</option></select><small>実際のMediaPipe検出はFE担当の実装で置き換えます。</small></div><p id="notice" role="status"></p></section>
<section class="conversation"><div class="section-title"><h2>同じ部屋の会話</h2><button class="secondary" id="restart-demo">2台を再接続</button><span>公開した言葉だけを相手へ届ける · 音声なし</span></div><div id="dialogue" class="dialogue"><p class="empty">まだ会話はありません。</p></div></section>
<div id="devices" class="devices"></div>
<section class="timeline"><div class="section-title"><h2>通信タイムライン</h2><span>直近60件 · 画像はカウンターに集約</span></div><div id="events" class="events"><p class="empty">接続を待っています</p></div></section>
<footer><span id="mode-description">AIモードを確認しています。</span><span>実機・本番フロントの接続先も同じ通信契約です。</span></footer></main>
<template id="device-template"><article class="device"><div class="device-heading"><div><span class="eyebrow">DEVICE</span><h2 class="device-id"></h2></div><span class="connection">接続中…</span></div><div class="inner"><div class="inner-heading"><span>本音 <small>観客だけに見える内面</small></span><b class="personality">—</b></div><p class="thought">どんな出会いがあるかな。</p><span class="intent">意向: 観察したい</span></div><div class="outward"><label>建前 · 表に出した反応</label><p class="public-text">反応待ち</p></div><div class="camera-wrap"><canvas class="camera" width="320" height="240"></canvas><div class="frame-label">FRAME <strong class="frame">—</strong></div><div class="source-label">JPEG / 2 FPS</div></div><div class="camera-controls"><button class="secondary camera-start">カメラを映像源にする</button><button class="secondary camera-stop" hidden>合成映像に戻す</button></div><div class="telemetry"><span>受信 <b class="frames">0</b> frames</span><span class="role">viewer</span><span class="fps">— fps</span></div><div class="reaction"><div class="robot-wrap"><div class="robot"><div class="robot-screen"><span class="eyes">● ●</span><span class="mouth">⌣</span></div></div><span class="expression">neutral</span></div><div class="action-summary"><label>FWが受信した指令</label><h3 class="action-name">idle</h3><p class="angles">PAN 0.00 · TILT 0.00</p><p class="seq">SEQ —</p></div></div><div class="emotions"></div><div class="decision"><span>最新の判断</span><p class="decision-text">判断待ち</p></div></article></template>
<script type="module" src="/lab.js"></script></body></html>
